---
dontChroot: false
timeout: 120
verbose: true
script:
  - "if [ -d /sys/firmware/efi ]; then grub-install --target=x86_64-efi --efi-directory=/boot/efi --removable --no-nvram; fi"
  - "echo 'grub-efi-amd64 grub2/force_efi_extra_removable boolean true' | debconf-set-selections"
i18n:
  name: "Making the computer start Lumo with Secure Boot"
  name[ru]: "Настройка запуска Lumo с безопасной загрузкой"
  name[nl]: "De computer klaarmaken om Lumo met Secure Boot te starten"
