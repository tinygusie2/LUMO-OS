---
dontChroot: false
timeout: 30
script:
  - "chown 0:0 / && chmod 0755 /"
  - "rm -f /etc/sddm.conf.d/lumo-autologin.conf"
  - "rm -f /etc/xdg/kscreenlockerrc"
  - "getent group autologin | cut -d: -f4 | grep -q . || rm -f /etc/xdg/kwalletrc"
  - "rm -f /etc/systemd/system/getty@tty1.service.d/autologin.conf"
  - "rmdir --ignore-fail-on-non-empty /etc/systemd/system/getty@tty1.service.d"
  - "rm -f /etc/systemd/system/multi-user.target.wants/lumo-boot-ready.service"
  - "rm -f /etc/systemd/system/lumo-boot-ready.service"
  - "rm -f /etc/systemd/system/multi-user.target.wants/lumo-live-language.service"
  - "rm -f /etc/systemd/system/lumo-live-language.service /usr/lib/lumo/live-language"
